name: Update and publish Criterion
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'build.py'
      - 'matches.json'
      - 'exclusions.json'
      - 'source.json'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '45 14 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: criterion-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: criterion-imdb-${{ github.run_id }}
          restore-keys: criterion-imdb-
      - name: Refresh collection and build catalogue
        run: python build.py
        env:
          ADDON_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Save refreshed catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs source.json matches.json build-report.json
          git diff --cached --quiet || git commit -m "Refresh Criterion collection"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish website and add-on
        id: deployment
        uses: actions/deploy-pages@v4
